name: Build & Deploy to Whop

on:
  push:
    branches:
      - main   # Every push to main → auto deploy to production
  workflow_dispatch: # Also allow manual trigger from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: true  # Cancel any in-progress deploy if a newer push arrives

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout the latest code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js (match local version)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript check
      - name: Type check
        run: npm run typecheck

      # 5. Build (client → dist/client/ + worker → dist/server/index.js)
      - name: Build
        run: npm run build

      # 6. Deploy to Whop (uses WHOP_API_KEY for non-interactive auth)
      - name: Deploy to Whop
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
        run: |
          npx @whop/cli apps deploy \
            --app app_cwcaMIErHBTI4d \
            --skip_build \
            --skip_typecheck

